; 
; Syntax of this configuration file:
; 
; [key]: setting key
; - Field "description": description, just for information.
; - Field "type": type of setting, e. g. mail, number, foreign_key, etc.
; - Field "default": default value
; - Field "db_field": corresponding database field (table.field)
;

[balance-title-max]
description = "Split event title across lines when longer than this many characters"
type = int
scope[] = certificateelements
example[] = "balance-title-max=20"

[balance-title-row]
description = "Target characters per row when balancing a long event title"
type = int
scope[] = certificateelements
example[] = "balance-title-row=20"

[bottom]
description = "Distance from page bottom to element (pt, or % with suffix)"
scope[] = certificateelements
example[] = "bottom=35pt"

[center]
description = "Horizontal center position (% of page width, or pt offset for center point)"
scope[] = certificateelements
example[] = "center=50%"

[certificates_font_size]
description = "Font size for standard text, e. g. footer"
default = 14pt

[certificates_line_height]
description = "Line height"
default = 1.4

[certificates_participation_text]
description = "Text on attendance certificates"
default = participated successfully
scope[] = website
scope[] = tournaments
scope[] = categories
subtree[] = series
scope[] = certificates

[certificates_placement_count]
description = "No. of people/teams in the placement that will get a placement certificate (others might get an attendance certificate)"
type = int
scope[] = website
scope[] = tournaments
default = 5
example[] = "certificates_placement_count=10"

[certificates_placement_count_female]
description = "No. of females in the placement that will get a placement certificate"
type = int
scope[] = tournaments
example[] = "certificates_placement_count_female=5"

[certificates_preview_dir]
description = "Folder for certificate preview files"
type = folder
default = %%% setting data_dir %%%/certificates/previews

[certificates_subtitle]
description = "Subtitle on certificates; {age_max} is replaced with the tournament age limit"
scope[] = categories
subtree[] = series
example[] = "certificates_subtitle=A-Turnier"
example[] = "certificates_subtitle=der Altersklasse unter {age_max} Jahren"

[certificates_subtitle_female]
description = "Subtitle on certificates for tournaments with separate female standings; {age_max} is replaced with the tournament age limit"
scope[] = categories
subtree[] = series
example[] = "certificates_subtitle_female=der Altersklasse U{age_max}w"
example[] = "certificates_subtitle_female=der Altersklasse unter {age_max} Jahren weiblich"

[certificates_supertitle]
description = "Line above the certificate title; {tournaments_edition} is replaced with the tournament edition number"
scope[] = categories
subtree[] = series
example[] = "certificates_supertitle={tournaments_edition}. Offene"
example[] = "certificates_supertitle={tournaments_edition}. Offenes"

[certificates_title]
description = "Main title on certificates; the event year is appended when tournaments_edition is not set"
scope[] = categories
subtree[] = series
example[] = "certificates_title=Deutsche Einzelmeisterschaft"

["font_file[bold]"]
description = "Font filename for bold font (without path, but with extension)"
scope[] = certificates
example[] = "font_file[bold]=Kanit-BoldItalic.ttf"

["font_file[regular]"]
description = "Font filename for regular font (without path, but with extension)"
scope[] = certificates
example[] = "font_file[regular]=LoveYaLikeASister.ttf"
example[] = "font_file[regular]=Kanit-Light.ttf"

[font-size]
description = "Font size for text or event title block (pt)"
scope[] = certificateelements
example[] = "font-size=11pt"
example[] = "font-size=14pt"
example[] = "font-size=20pt"
example[] = "font-size=24pt"

[font-size-subtitle]
description = "Font size for event subtitle line in event element (pt)"
scope[] = certificateelements
example[] = "font-size-subtitle=18pt"

[font-weight]
description = "Font weight for event supertitle and title lines"
type = select
scope[] = certificateelements
enum[] = bold
enum[] = normal
example[] = "font-weight=bold"
example[] = "font-weight=normal"

[font-weight-subtitle]
description = "Font weight for event subtitle line"
type = select
scope[] = certificateelements
enum[] = bold
enum[] = normal
enum[] = regular
example[] = "font-weight-subtitle=bold"
example[] = "font-weight-subtitle=normal"

[height]
description = "Element height (pt)"
scope[] = certificateelements
example[] = "height=14pt"
example[] = "height=350pt"
example[] = "height=818pt"

[left]
description = "Distance from page left to element (pt)"
scope[] = certificateelements
example[] = "left=0pt"
example[] = "left=10pt"
example[] = "left=160pt"

[line-height]
description = "Line height multiplier for event title block"
type = number
scope[] = certificateelements
example[] = "line-height=1"
example[] = "line-height=1.1"
example[] = "line-height=1.17"

[memory_limit]
description = "Increase PHP memory limit, if needed for certificate PDF generation"
scope[] = certificates
example[] = "memory_limit=512M"

[middle]
description = "Vertical center position (% of page height, or pt offset for center point)"
scope[] = certificateelements
example[] = "middle=50%"
example[] = "middle=25.3%"

[right]
description = "Distance from page right to element (pt); used with width for horizontal placement"
scope[] = certificateelements
example[] = "right=35pt"
example[] = "right=115pt"

[text]
description = "Static text for textblock elements"
scope[] = certificateelements
example[] = "text=Urkunde"

[text-align]
description = "Text alignment within the element box"
type = select
scope[] = certificateelements
enum[] = left
enum[] = center
enum[] = right
example[] = "text-align=center"

[top]
description = "Distance from page top to element (pt, or % with suffix)"
scope[] = certificateelements
example[] = "top=20pt"
example[] = "top=430pt"

[width]
description = "Element width (pt)"
scope[] = certificateelements
example[] = "width=90pt"
example[] = "width=535pt"
example[] = "width=595pt"
